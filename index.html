<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English → Kannada</title>
<style>
  :root{
    --page:#F5F4EE; --card:#fff; --ink:#2C2C2A; --ink2:#5F5E5A; --ink3:#888780;
    --line:#D3D1C7; --accent:#1D9E75; --amber:#854F0B; --chip:#EEEDE5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:32px 20px 80px}
  header h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:30px;margin:0 0 4px}
  header p{color:var(--ink2);margin:0 0 24px;font-style:italic}
  .tabs{display:flex;gap:6px;margin-bottom:24px;border-bottom:1px solid var(--line)}
  .tab{appearance:none;border:0;background:none;font:inherit;color:var(--ink3);
    padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
  .panel{display:none} .panel.active{display:block}

  /* shared */
  input,select,textarea,button{font:inherit;color:var(--ink)}
  .search{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:10px;
    background:var(--card);font-size:16px;outline:none}
  .search:focus{border-color:var(--accent)}
  textarea.search{resize:vertical;min-height:70px;font-family:inherit}
  .hint{color:var(--ink3);font-size:13px;margin:8px 2px 20px}

  /* dictionary */
  .cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
  .catbtn{appearance:none;border:1px solid var(--line);background:var(--card);font:inherit;
    font-size:13px;color:var(--ink2);padding:5px 11px;border-radius:99px;cursor:pointer}
  .catbtn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .catbtn:disabled{opacity:.45;cursor:not-allowed}
  .rows{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .row{display:flex;align-items:baseline;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .en{flex:1;color:var(--ink2)}
  .row .ka{flex:1;font-weight:500}
  .row .cat{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;min-width:74px;text-align:right}
  .empty{padding:28px 16px;color:var(--ink3);text-align:center}
  mark{background:#FBF0C9;color:inherit;padding:0 1px;border-radius:2px}

  /* translate */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:6px}
  .out{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
  .out .lbl{font-size:12px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .out .sent{font-family:Georgia,serif;font-size:26px;font-weight:500;line-height:1.4}
  .out .gloss{color:var(--ink2);margin-top:6px;font-style:italic;font-size:14px}
  .row-btns{display:flex;gap:8px;margin-top:10px}
  .row-btns .catbtn{padding:9px 16px;font-size:14px}
  .primary{background:var(--ink);color:#fff;border-color:var(--ink);margin-left:auto}
  .unk{font-style:italic;color:var(--ink3);border-bottom:1px dotted var(--ink3)}

  @media (max-width:480px){
    .wrap{padding:20px 14px 60px}
    header h1{font-size:25px}
    .out{padding:16px}
    .out .sent{font-size:21px}
    .row{flex-wrap:wrap;gap:4px 14px}
    .row .cat{min-width:0;text-align:left;flex-basis:100%}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>English → Kannada</h1>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="translate">Translate</button>
    <button class="tab" data-tab="dict">Dictionary</button>
  </div>

  <!-- TRANSLATE -->
  <section class="panel active" id="translate">
    <div class="field">
      <label>English</label>
      <textarea class="search" id="tIn" placeholder="Type a sentence… (e.g. I like biryani)"></textarea>
      <div class="row-btns">
        <button class="catbtn primary" id="tGo" type="button">Translate →</button>
      </div>
    </div>

    <div class="out">
      <div class="lbl">Kannada</div>
      <div class="sent" id="tOut">—</div>
      <div class="gloss" id="tMeta"></div>
    </div>
  </section>

  <!-- DICTIONARY -->
  <section class="panel" id="dict">
    <input class="search" id="q" placeholder="Type English or Kannada… (e.g. thanks, naanu, water)" autocomplete="off">
    <div class="hint">Searches both directions. Nothing shown = the word isn't in your notes yet.</div>
    <div class="cats" id="cats"></div>
    <div class="rows" id="rows"></div>
  </section>
</div>

<script>
/* ---------- DICTIONARY DATA (straight from your notes) ---------- */
const DICT = [
  // greetings
  ["Hello","namaskaara","greetings"],["Good morning","shubhodaya","greetings"],
  ["Good night","Shubha raatri","greetings"],["Thanks","dhanyavaadagaLu","greetings"],

  ["With you","ninnalli / nimmalli","pronoun"],
  ["He","Avanu","pronoun"],["She","AvaLu","pronoun"],["His","avana","pronoun"],
  ["Her","avaLa","pronoun"],["They","avaru","pronoun"],["Their","avara","pronoun"],
  ["Them","avarige","pronoun"],["This / It","Idu","pronoun"],["That","Adu","pronoun"],
  ["To him","avanige","pronoun"],["To her","AvaLige","pronoun"],["This (adjective)","ee","pronoun"],

  ["Today","Ivattu","time"],["Tomorrow","NaaLe","time"],["Yesterday","nenne","time"],
  ["Day after","naaLiddu","time"],["Day before","monne","time"],["Time","gante / samaya","time"],

  ["Meal / food","Oota","word"],["Done?","Aaita? / Aitu","word"],["Breakfast","Tindi","word"],
  ["Vegetables","Tarkari / TarkarigaLu","word"],["Milk","HaaLu","word"],
  ["Sweet","SeeHi / sihi","word"],["Sweet dish","SeeHi Tindi","word"],["Shirt","anGI","word"],
  ["Rain","maLe","word"],["Near","Hattira","word"],["Far","Doora","word"],
  ["Water","neeru / neeRa","word"],["Pen","pen","word"],["Window","kiTaki","word"],
  ["Money","duDDu","word"],["So / therefore","adikke","word"],["Then / if so","haagidre","word"],
  ["From","inda","word"],
  ["I want","nanage bEku","word"],["Don't want","bEDa","word"],
  ["Like / love","ishta","word"],["Don't like","ishtilla","word"],
  ["-s (make plural)","…gaLu","word"],["is / there is (hai)","ide","word"],
  ["How much","eshTu","word"],["Or","Athva","word"],
  ["Work","KeLsa","word"],["Doing","maaDutta","word"],["Giving","kodiyutta","word"],
  ["Eating","tinnutta","word"],["Drinking","kuDiyutta","word"],["Waiting","kaayutta","word"],
  ["Son / dude (casual)","maga","word"],["Dress / clothes","baTTe","word"],["Book","pustaka","word"],
  ["And","matte","word"],["No / not there","illa","word"],["Quickly / fast","BeGa","word"],
  ["A little / somewhat","swalpa","word"],["Good / nice (it's good)","changide","word"],
  ["Very / a lot","tumba","word"],["All / everything","ella","word"],["Enough","saaku","word"],
  ["Not available / won't get","sigolla","word"],["Only / that's all","ashte","word"],
  ["Tiredness","sushtu","word"],["Different / another","bere","word"],["Minutes","nimsha","word"],
  ["Brother / sir (address)","Anna","word"],["Total (how much)","eshTayTu","word"],
  // numbers
  ["5","aidu","number"],["10","hattu","number"],["20","ipattu","number"],["30","moovattu","number"],
  ["40","naalvattu","number"],["50","aivattu","number"],["60","aravattu","number"],
  ["70","epattu","number"],["80","embattu","number"],["90","tombattu","number"],
  ["100","nooru","number"],["200","Innoru","number"],["300","Munnoru","number"],
  ["400","nannooru","number"],["500","ainooru","number"],["600","Aarnooru","number"],
  ["700","eLnooru","number"],["800","enTnooru","number"],["900","Ombainooru","number"],
  ["1000","saavira","number"],["2000","eradu saavira","number"],
  // quantities (kilo / market)
  ["Quarter kilo","Kaalu kilo","quantity"],["Half kilo","Ardha kilo","quantity"],
  ["Three-quarter kilo","Mukkalu kilo","quantity"],["One kilo","Ondu kilo","quantity"],
  ["Rupee","Rupayi","quantity"],
  // food & market
  ["Onion","eruLLi","food"],["Green chilly","hasiru menasinakayi","food"],
  ["Brinjal / eggplant","Badanakeyi","food"],["Okra / ladies finger","benDekaayi","food"],
  ["Potato","aaluGaDDe","food"],["Garlic","beLLuLLi","food"],
  ["Bitter gourd","Haagalakaayi","food"],["Radish","mulangi","food"],
  ["Coriander / cilantro","kottambiri","food"],
  // directions
  ["Left","eDa","direction"],["Right","Bala","direction"],["Straight","nEra","direction"],
  ["Back","hinde","direction"],["Front","munde","direction"],["Up / above","mEle","direction"],
  ["Down / below","keLage","direction"],["There","alli","direction"],["Here","illi","direction"],
  ["Left side","eDa-Gade","direction"],["Right side","Bala-Gade","direction"],
  ["That side","aa kaDe","direction"],["This side","ee kaDe","direction"],
  ["Outside","HoraGe","direction"],["Inside","OlaGe","direction"],
  // questions
  ["How","hEge","question"],["What","Enu","question"],["Where","elli","question"],
  ["When","yaavaga","question"],["Why","yaake","question"],["Which","yaava","question"],
  ["Who","yaaru","question"],["Whose","yaara","question"],["Whom","yaarana","question"],
  ["To where","Yellige","question"],
  // verbs (roots)
  ["Sing","HaaDu","verb"],["Play","Aadu","verb"],["Give (root)","KoDu","verb"],
  ["Take","Tego / tago","verb"],["Drink","KuDi","verb"],["Walk","Nadi","verb"],
  ["Eat","Tina","verb"],["Do (root)","MaaDu","verb"],["Speak","MaathaaDu","verb"],
  ["Listen","KeLu","verb"],["Jump","HaaRu","verb"],["Dance","KuNi","verb"],
  ["Bother","KaaDu","verb"],["See","noDu","verb"],["Sleep","Malagu","verb"],
  ["Wake up","ELu","verb"],["Close","Muchchu","verb"],["Open","Tere","verb"],
  ["Write","Bare / Bari","verb"],["Call / Invite","Kari","verb"],
  ["Wait","Kaayu","verb"],["Stand / stop","Nillu","verb"],["Read / study","Odu","verb"],
  ["Happen / become","Agu","verb"],
];

/* casual expressions */
const EXPRESSIONS = [
  ["Really?","NiJwaaglu"],["Is it? / really?","Howdaa"],["Yes","Howdu"],
  ["Oh my god","Ayyo devre"],["Okay / alright","Sari"],
  ["That's okay / never mind","Parvagilla"],["Please","dayavittu"],
  ["So sad / what a shame","Ayya che"],["Nothing like that","Haagenilla"],
  ["I am great","naan sakkataagidini"],
];
EXPRESSIONS.forEach(e=>DICT.push([e[0],e[1],"expression"]));

/* phrases live in the dictionary too, under 'phrase' */
const PHRASES = [
  ["What is your name? (respect)","Nimma hesaru yenu?"],
  ["My name is Chinmay","Nanna hesaru Chinmay"],
  ["Who are you?","Neevu yaaru?"],
  ["Did you finish food?","Oota aita?"],
  ["Did you have lunch?","Oota maaDidra?"],
  ["How are you? (respect)","Neevu hEge iddeera?"],
  ["Where are you?","Neevu elli iddeera?"],
  ["When are you coming?","Neevu yaavaga barutta iddeera?"],
  ["Whom should I ask?","Yaarana keLabeku?"],
  ["I work at Talentica","Naanu Talentica dalli keLsa maaDuttEne"],
  ["Where do you work?","Neevu elli keLsa maaDutteera?"],
  ["There is a pen (over there)","Alli onDu pen ide"],
  ["I have a pen","Nanna hattira onDu pen ide"],
  ["Your name","Ninna hesaru"],
  ["This is your pen","Idu ninna pen"],
  ["The pen is yours","ee pen ninnadu"],
  ["Which is that","Adu yaava?"],
  ["I am Chinmay","Naanu Chinmay"],
  ["I know a little Kannada","Nanu swalpa kannada gottu"],
  ["I am working","Naanu keLsa maaDutta iddEne"],
  ["I was working","Naanu keLsa maaDutta idde"],
  ["Is there onion?","eruLLi idiya?"],
  ["What happened?","Yenu Aitu?"],
  ["Nothing","Enu illa"],
  ["You didn't clean the window","Neevu kiTaki clean maaDilla"],
  ["I have done it last week","Naanu hindina vaara maaDidde"],
  ["Last month I gave you money, so this month I won't pay you","Naanu ninge hindina tingaLu duDDu koTTidde, adikke ee tingaLu duDDu koDalla!"],
  ["Then I won't come from tomorrow","haagidre naale inda naanu baralla!"],
];
PHRASES.forEach(p=>DICT.push([p[0],p[1],"phrase"]));

const CATS = ["all","greetings","pronoun","time","word","number","quantity","food","direction","question","verb","expression","phrase"];
const CATLABEL = {all:"All",greetings:"Greetings",pronoun:"Pronouns",time:"Time",word:"Common",
  number:"Numbers",quantity:"Quantities",food:"Food & Market",direction:"Directions",question:"Questions",
  verb:"Verbs",expression:"Expressions",phrase:"Phrases"};

/* ---------- DICTIONARY UI ---------- */
let activeCat="all";
const qEl=document.getElementById("q"), rowsEl=document.getElementById("rows"), catsEl=document.getElementById("cats");

CATS.forEach(c=>{
  const b=document.createElement("button");
  b.className="catbtn"+(c==="all"?" active":""); b.textContent=CATLABEL[c];
  b.onclick=()=>{activeCat=c;[...catsEl.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");render();};
  catsEl.appendChild(b);
});

function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function hl(text,q){ if(!q) return esc(text);
  const i=text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text);
  return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
}
function render(){
  const q=qEl.value.trim().toLowerCase();
  let list=DICT.filter(([en,ka,cat])=>{
    if(activeCat!=="all" && cat!==activeCat) return false;
    if(!q) return true;
    return en.toLowerCase().includes(q)||ka.toLowerCase().includes(q);
  });
  if(!list.length){ rowsEl.innerHTML='<div class="empty">Not in your notes yet.</div>'; return; }
  rowsEl.innerHTML=list.map(([en,ka,cat])=>
    `<div class="row"><span class="en">${hl(en,q)}</span><span class="ka">${hl(ka,q)}</span><span class="cat">${CATLABEL[cat]}</span></div>`
  ).join("");
}
qEl.addEventListener("input",render);
render();

/* ---------- TRANSLATE: dictionary-driven English → Kannada ---------- */
function escapeRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");}
function normalize(s){return s.toLowerCase().replace(/[?.!,]/g,"").trim().replace(/\s+/g," ");}

// Build a single-word lookup and a multi-word phrase list from every
// non-phrase DICT entry (splitting "a / b" synonym groups on each side).
const WORD_MAP = new Map();
const PHRASE_LIST = [];
DICT.forEach(([en,ka,cat])=>{
  if(cat==="phrase") return;
  const kaFirst = ka.split("/")[0].replace(/\(.*?\)/g,"").trim();
  if(!kaFirst) return;
  en.split("/").forEach(rawVariant=>{
    const clean = rawVariant.replace(/\(.*?\)/g,"").trim();
    if(!clean || clean.startsWith("-")) return;
    if(clean.includes(" ")){
      PHRASE_LIST.push({en:clean.toLowerCase(), ka:kaFirst});
    } else if(!WORD_MAP.has(clean.toLowerCase())){
      WORD_MAP.set(clean.toLowerCase(), kaFirst);
    }
  });
});
PHRASE_LIST.sort((a,b)=> b.en.split(" ").length - a.en.split(" ").length || b.en.length - a.en.length);

const PHRASE_LOOKUP = new Map(PHRASES.map(([en,ka])=>[normalize(en), ka]));

// word/phrase substitution used both for the fallback tier and for filling
// in the "___" slot of a sentence frame.
function wordByWord(text){
  const store=[];
  let working = text;
  PHRASE_LIST.forEach(({en,ka})=>{
    const re = new RegExp("\\b"+escapeRe(en)+"\\b","gi");
    working = working.replace(re, ()=>{ store.push(ka); return `@@${store.length-1}@@`; });
  });
  const tokens = working.split(/(\s+)/);
  let unknownCount=0;
  const htmlParts=[], plainParts=[];
  tokens.forEach(tok=>{
    if(tok==="") return;
    if(/^\s+$/.test(tok)){ htmlParts.push(tok); plainParts.push(tok); return; }
    const ph = tok.match(/^@@(\d+)@@([.,!?;:]*)$/);
    if(ph){ const ka=store[+ph[1]]; htmlParts.push(esc(ka)+ph[2]); plainParts.push(ka+ph[2]); return; }
    const m = tok.match(/^([A-Za-z']+)([.,!?;:]*)$/);
    if(!m){ htmlParts.push(esc(tok)); plainParts.push(tok); return; }
    const [,word,punct]=m;
    const lw=word.toLowerCase();
    if(WORD_MAP.has(lw)){
      const ka=WORD_MAP.get(lw);
      htmlParts.push(esc(ka)+punct); plainParts.push(ka+punct);
    } else {
      unknownCount++;
      htmlParts.push(`<span class="unk" title="Not in dictionary — kept as English">${esc(word)}</span>${punct}`);
      plainParts.push(word+punct);
    }
  });
  return {html:htmlParts.join(""), plain:plainParts.join(""), unknownCount};
}

// documented sentence frames — grammar from the "Sentence frames" notes
const FRAMES = [
  {re:/^i\s+don'?t\s+like\s+(.+?)[.!]?$/i,        tmpl:o=>[`Nanage ${o.html} ishtilla`, `Nanage ${o.plain} ishtilla`]},
  {re:/^i\s+don'?t\s+want\s+(.+?)[.!]?$/i,        tmpl:o=>[`Nanage ${o.html} bEDa`, `Nanage ${o.plain} bEDa`]},
  {re:/^i\s+like\s+(.+?)[.!]?$/i,                 tmpl:o=>[`Nanage ${o.html} ishta`, `Nanage ${o.plain} ishta`]},
  {re:/^i\s+want\s+(.+?)[.!]?$/i,                 tmpl:o=>[`Nanage ${o.html} bEku`, `Nanage ${o.plain} bEku`]},
  {re:/^i\s+have\s+(?:a\s+|an\s+|one\s+)?(.+?)[.!]?$/i, tmpl:o=>[`Nanna hattira onDu ${o.html} ide`, `Nanna hattira onDu ${o.plain} ide`]},
  {re:/^(?:there\s+is|there's)\s+(?:a\s+|an\s+|one\s+)?(.+?)[.!]?$/i, tmpl:o=>[`Alli onDu ${o.html} ide`, `Alli onDu ${o.plain} ide`]},
  {re:/^give\s+me\s+(.+?)[.!]?$/i,                tmpl:o=>[`Nanage ${o.html} koDi`, `Nanage ${o.plain} koDi`]},
  {re:/^give\s+us\s+(.+?)[.!]?$/i,                tmpl:o=>[`Namage ${o.html} koDi`, `Namage ${o.plain} koDi`]},
  {re:/^give\s+them\s+(.+?)[.!]?$/i,              tmpl:o=>[`Avarige ${o.html} koDi`, `Avarige ${o.plain} koDi`]},
  {re:/^my\s+name\s+is\s+(.+?)[.!]?$/i,           tmpl:o=>[`Nanna hesaru ${o.html}`, `Nanna hesaru ${o.plain}`]},
  {re:/^i\s+work\s+(?:in|at)\s+(.+?)[.!]?$/i,     tmpl:o=>[`Naanu ${o.html}-alli keLsa maaDuttEne`, `Naanu ${o.plain}-alli keLsa maaDuttEne`]},
  {re:/^we\s+don'?t\s+like\s+(.+?)[.!]?$/i,       tmpl:o=>[`Namage ${o.html} ishtilla`, `Namage ${o.plain} ishtilla`]},
  {re:/^we\s+don'?t\s+want\s+(.+?)[.!]?$/i,       tmpl:o=>[`Namage ${o.html} bEDa`, `Namage ${o.plain} bEDa`]},
  {re:/^we\s+like\s+(.+?)[.!]?$/i,                tmpl:o=>[`Namage ${o.html} ishta`, `Namage ${o.plain} ishta`]},
  {re:/^we\s+want\s+(.+?)[.!]?$/i,                tmpl:o=>[`Namage ${o.html} bEku`, `Namage ${o.plain} bEku`]},
  {re:/^you\s+don'?t\s+want\s+(.+?)[.!]?$/i,      tmpl:o=>[`Nimage ${o.html} bEDa`, `Nimage ${o.plain} bEDa`]},
  {re:/^you\s+don'?t\s+like\s+(.+?)[.!]?$/i,      tmpl:o=>[`Nimage ${o.html} ishtilla`, `Nimage ${o.plain} ishtilla`]},
  {re:/^you\s+want\s+(.+?)[.!]?$/i,               tmpl:o=>[`Nimage ${o.html} bEku`, `Nimage ${o.plain} bEku`]},
  {re:/^you\s+like\s+(.+?)[.!]?$/i,               tmpl:o=>[`Nimage ${o.html} ishta`, `Nimage ${o.plain} ishta`]},
];

function translateSentence(input){
  const trimmed = input.trim();
  if(!trimmed) return null;
  const norm = normalize(trimmed);
  if(PHRASE_LOOKUP.has(norm)){
    const ka = PHRASE_LOOKUP.get(norm);
    return {html:esc(ka), plain:ka, mode:"Matched a saved phrase", unknownCount:0};
  }
  for(const f of FRAMES){
    const m = trimmed.match(f.re);
    if(m){
      const obj = wordByWord(m[1].trim());
      const [html, plain] = f.tmpl(obj);
      return {html, plain, mode:"Built from a sentence frame", unknownCount:obj.unknownCount};
    }
  }
  const res = wordByWord(trimmed);
  return {html:res.html, plain:res.plain, mode:"Word-by-word from your dictionary", unknownCount:res.unknownCount};
}

const tIn=document.getElementById("tIn"), tOut=document.getElementById("tOut"), tMeta=document.getElementById("tMeta");
const tGo=document.getElementById("tGo");

function runTranslate(){
  const res = translateSentence(tIn.value);
  if(!res){ tOut.innerHTML="—"; tMeta.textContent=""; return; }
  tOut.innerHTML = res.html;
  tMeta.textContent = res.mode + (res.unknownCount ? ` · ${res.unknownCount} word${res.unknownCount>1?"s":""} not in dictionary` : "");
}
tGo.addEventListener("click", runTranslate);
tIn.addEventListener("keydown", e=>{ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); runTranslate(); } });

/* ---------- TABS ---------- */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  document.getElementById(t.dataset.tab).classList.add("active");
});

runTranslate();
</script>
</body>
</html>
